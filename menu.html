<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Clay Hero</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; color: #fff7e6; font-family: "Arial Rounded MT Bold", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    background: #1a1438; user-select: none; -webkit-user-select: none; }
  body { background: radial-gradient(circle at 20% 10%, #5a43b8 0%, rgba(90,67,184,0) 45%), radial-gradient(circle at 85% 90%, #b8347a 0%, rgba(184,52,122,0) 40%), linear-gradient(160deg, #2b2060, #17102f); background-attachment: fixed; overflow-x: hidden; }
  .top { position: fixed; border-radius: 50%; opacity: .35; filter: blur(2px); animation: yuz 9s ease-in-out infinite; pointer-events: none;
    box-shadow: inset -14px -18px 0 rgba(0,0,0,.18), inset 10px 12px 0 rgba(255,255,255,.2); }
  @keyframes yuz { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
  @keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @keyframes nabiz { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  #sayfa { position: relative; max-width: 1180px; margin: 0 auto; padding: 20px 22px 30px; min-height: 100vh; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font-size: clamp(34px, 6vw, 62px); font-weight: 900; letter-spacing: 3px; color: #ffd23a; -webkit-text-stroke: 3px #3a1f8a; paint-order: stroke fill;
    text-shadow: 0 6px 0 rgba(0,0,0,.4); animation: pop .5s ease-out both; }
  .logo small { display: block; font-size: .3em; letter-spacing: 4px; color: #fff7e6; -webkit-text-stroke: 0; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .yuvarlak { width: 60px; height: 60px; border-radius: 50%; border: 4px solid rgba(255,255,255,.9); background: rgba(30,22,80,.72); color: #fff; font-size: 26px; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.35); font-family: inherit; }
  .yuvarlak:active, .dugme:active, .kart:active { transform: translateY(4px); }
  #ust { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 22px; align-items: center; animation: pop .5s .08s ease-out both; }
  #portre { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 8px solid #fff; box-shadow: 0 12px 0 rgba(0,0,0,.35), 0 0 0 10px rgba(255,210,58,.35); background: #453a80; }
  #isim { font-size: clamp(26px, 4vw, 44px); margin: 0 0 4px; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  #alt { color: #cfc6f0; font-size: clamp(15px, 2vw, 20px); margin: 0 0 18px; }
  .dugme { font: inherit; font-weight: 900; border: 5px solid #fff; border-radius: 40px; color: #fff; cursor: pointer; text-shadow: 0 3px 0 rgba(0,0,0,.28);
    background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 45%, rgba(0,0,0,.14));
    box-shadow: 0 10px 0 rgba(0,0,0,.35), inset 0 -8px 0 rgba(0,0,0,.18); }
  #oyna { font-size: clamp(28px, 4.4vw, 46px); padding: 18px 56px; background-color: #e23b2e; animation: nabiz 1.6s ease-in-out infinite; }
  #degis { font-size: clamp(16px, 2vw, 22px); padding: 10px 24px; background-color: #6a55d8; margin-left: 12px; border-width: 4px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .satir { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
  h2 { margin: 6px 0 0; font-size: clamp(18px, 2.4vw, 26px); color: #ffd23a; letter-spacing: 2px; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #gorevler { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; animation: pop .5s .16s ease-out both; }
  .kart { position: relative; display: block; text-decoration: none; color: #fff; border-radius: 26px; overflow: hidden; border: 5px solid #fff; aspect-ratio: 3 / 4;
    background-size: cover; background-position: center; box-shadow: 0 8px 0 rgba(0,0,0,.35); }
  .kart::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,50,0) 35%, rgba(20,12,50,.92) 78%); }
  .kart .no { position: absolute; left: 10px; top: 10px; z-index: 1; width: 38px; height: 38px; border-radius: 50%; background: #ffd23a; color: #2b1a00; font-weight: 900; font-size: 20px;
    display: flex; align-items: center; justify-content: center; border: 3px solid #fff; }
  .kart .tik { position: absolute; right: 10px; top: 10px; z-index: 1; background: #2fb86a; border: 3px solid #fff; border-radius: 18px; padding: 3px 10px; font-size: 13px; }
  .kart .yazi { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 10px 12px 12px; }
  .kart b { display: block; font-size: clamp(14px, 1.7vw, 19px); line-height: 1.15; }
  .kart span { display: block; font-size: clamp(11px, 1.2vw, 13px); color: #d9d1f7; margin-top: 4px; }
  .kart img { position: absolute; left: 50%; top: 34%; width: 62%; transform: translate(-50%, -50%); }
  #uygulama { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; min-height: 28px; color: #d9d1f7; font-size: 15px; }
  #uygKur, #uygTamam { font: inherit; font-weight: 900; color: #fff; background: #2fb86a; border: 3px solid #fff; border-radius: 24px; padding: 8px 18px; min-height: 44px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #uygTarif { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; width: min(90vw, 420px); background: #2b2060; border: 5px solid #fff; border-radius: 26px; padding: 20px 22px; text-align: left; color: #fff7e6; box-shadow: 0 14px 0 rgba(0,0,0,.4); }
  #uygTarif b { color: #ffd23a; font-size: 20px; } #uygTarif p { line-height: 1.6; font-size: 16px; }
  footer { margin-top: auto; text-align: center; color: #a99fe0; font-size: 13px; }
  @media (max-width: 820px), (orientation: portrait) {
    #ust { grid-template-columns: 1fr; text-align: center; } #portre { max-width: 240px; margin: 0 auto; } .satir { justify-content: center; }
    #gorevler { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kart { aspect-ratio: 4 / 3; } .kart img { width: 34%; top: 36%; }
    #degis { margin-left: 0; }
  }
</style>
<!--uyg--><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1438"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Clay Hero"><link rel="apple-touch-icon" href="ortak/ikon-180.png"><link rel="icon" href="ortak/ikon-192.png"><!--/uyg-->
</head>
<body>
<div class="top" style="left:-60px;top:30%;width:200px;height:200px;background:#ff5a4d"></div>
<div class="top" style="right:-40px;top:8%;width:140px;height:140px;background:#39d0e8;animation-delay:-3s"></div>
<div class="top" style="right:12%;bottom:-70px;width:220px;height:220px;background:#ffd23a;animation-delay:-6s"></div>
<div id="sayfa">
  <header>
    <div class="logo">CLAY HERO<small>SAVE THE WORLD</small></div>
    <button id="ses" class="yuvarlak" type="button" aria-label="Sound">🔊</button>
  </header>
  <div id="ust">
    <img id="portre" alt="Your clay hero">
    <div>
      <h1 id="isim"></h1>
      <p id="alt">Five missions. One clay hero. Tap play to start the adventure.</p>
      <div class="satir"><button id="oyna" class="dugme" type="button">▶ PLAY</button><button id="degis" class="dugme" type="button">✎ Change hero</button></div>
    </div>
  </div>
  <h2>MISSIONS</h2>
  <div id="gorevler"></div>
  <div id="uygulama"></div>
  <footer>Preview build · best on a tablet</footer>
</div>
<script>
(function () {
  "use strict";
  var K = null; try { K = JSON.parse(localStorage.getItem("clayHero") || "null"); } catch (e) {}
  if (!K || !K.sac) { location.replace("index.html"); return; }
  var $ = function (id) { return document.getElementById(id); };
  $("portre").src = "portre/" + K.sac + "_" + K.renk + "_" + K.ten + ".jpg";
  $("isim").textContent = (K.isim || "Clay Hero") + " is ready!";
  var oyn = {}; try { oyn = JSON.parse(localStorage.getItem("ch_oynandi") || "{}"); } catch (e) {}
  var G = [
    ["sehirler", "Save the Cities", "Five cities, one invasion", "oyun/index.html", "oyun/varlik/arka.jpg", ""],
    ["kosu", "Save the Parrot", "Rooftop run · 3 levels", "oyun/kosu/index.html", "oyun/kosu/varlik/arka.jpg", ""],
    ["tirtil", "Alien Caterpillar", "Pop the clay chain", "oyun/tirtil/index.html", "", "oyun/tirtil/varlik/bas.png"],
    ["kacis", "Escape the Planet", "Jump before the lava", "oyun/kacis/index.html", "oyun/kacis/varlik/arka.jpg", ""],
    ["final", "Knock Down the Tower", "Catapult · 5 levels", "oyun/final/index.html", "oyun/final/varlik/arka.jpg", ""]
  ];
  G.forEach(function (g, i) {
    var a = document.createElement("a"); a.className = "kart"; a.href = g[3];
    a.style.backgroundImage = g[4] ? "url(" + g[4] + ")" : "linear-gradient(160deg, #7a3fd0, #2b1a70)";
    var h = '<div class="no">' + (i + 1) + "</div>" + (oyn[g[0]] ? '<div class="tik">played</div>' : "");
    if (g[5]) h += '<img src="' + g[5] + '" alt="">';
    a.innerHTML = h + '<div class="yazi"><b>' + g[1] + "</b><span>" + g[2] + "</span></div>"; $("gorevler").appendChild(a);
  });
  $("oyna").addEventListener("click", function () { location.href = "oyun/index.html"; });
  $("degis").addEventListener("click", function () { location.href = "index.html?edit=1"; });
  var kapali = false; try { kapali = localStorage.getItem("ch_ses") === "0"; } catch (e) {}
  function sesYaz() { $("ses").textContent = kapali ? "🔇" : "🔊"; }
  $("ses").addEventListener("click", function () { kapali = !kapali; try { localStorage.setItem("ch_ses", kapali ? "0" : "1"); } catch (e) {} sesYaz(); });
  sesYaz();
})();
</script>
<script src="ortak/uygulama.js?v=1"></script>
</body>
</html>
